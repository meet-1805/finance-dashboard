<div class="dashboard-container">
  <app-sidebar></app-sidebar>

  <div class="main-content">
    
    <!-- Visual Six-Step Progress Indicator -->
    <div class="progress-indicator">
      <div class="step active">
        <span class="step-num">1</span>
        <span class="step-name">Upload</span>
      </div>
      <div class="progress-line"></div>
      <div class="step">
        <span class="step-num">2</span>
        <span class="step-name">Preview</span>
      </div>
      <div class="progress-line"></div>
      <div class="step">
        <span class="step-num">3</span>
        <span class="step-name">Duplicates</span>
      </div>
      <div class="progress-line"></div>
      <div class="step">
        <span class="step-num">4</span>
        <span class="step-name">Categorize</span>
      </div>
      <div class="progress-line"></div>
      <div class="step">
        <span class="step-num">5</span>
        <span class="step-name">Review</span>
      </div>
      <div class="progress-line"></div>
      <div class="step">
        <span class="step-num">6</span>
        <span class="step-name">Import</span>
      </div>
    </div>

    <h1>Import Bank Statement</h1>
    <p class="description">
      Upload your monthly bank statement in CSV format to automatically extract transactions, perform duplicate detection, and assign expense categories before importing them into your dashboard.
    </p>

    <div class="import-card">
      <div class="file-drop-zone">
        <label for="csvFileInput" class="file-picker-label">
          <span class="icon">📁</span>
          <span class="label-text">
            {{ selectedFile ? selectedFile.name : 'Choose a CSV file...' }}
          </span>
        </label>
        <input 
          id="csvFileInput"
          type="file" 
          accept=".csv"
          (change)="onFileSelected($event)"
          [disabled]="isLoading"
        />
      </div>

      <div class="action-section">
        <button 
          class="btn-upload" 
          [disabled]="!selectedFile || isLoading"
          (click)="uploadStatement()"
        >
          <span *ngIf="!isLoading">Upload and Process</span>
          <span *ngIf="isLoading" class="spinner-container">
            <span class="spinner"></span> Processing file...
          </span>
        </button>
      </div>

      <div class="error-message" *ngIf="errorMessage">
        {{ errorMessage }}
      </div>
    </div>
  </div>
</div>
